<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firdira Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--grass:#6aa84f;--wood:#8b5a2b;--wd:#4a2e14;--parch:#f6e3b0;--ink:#3b2412;--gold:#f2b632;--red:#c0392b;--green:#3c9a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:11px/1.6 'Press Start 2P',ui-monospace,monospace;color:var(--ink);background:var(--grass);background-image:linear-gradient(90deg,rgba(0,0,0,.06) 50%,transparent 50%),linear-gradient(rgba(0,0,0,.06) 50%,transparent 50%);background-size:32px 32px}
h1{text-align:center;color:#fff;text-shadow:3px 3px 0 var(--wd);font-size:18px;margin:18px 8px 4px}
.tag{text-align:center;color:#fff;text-shadow:2px 2px 0 var(--wd);margin-bottom:6px}
.panel{background:var(--parch);border:4px solid var(--wd);box-shadow:0 0 0 4px var(--wood),0 8px 0 4px var(--wd);padding:16px;margin:18px auto;max-width:720px;width:calc(100% - 28px)}
.btn{font:inherit;background:var(--gold);color:var(--ink);border:4px solid var(--wd);padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 var(--wd);margin:6px 4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wd)}.btn[disabled]{opacity:.5;cursor:not-allowed}
input{font:inherit;padding:10px;border:4px solid var(--wd);background:#fff;width:100%;max-width:260px}
.pls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pl{width:100px;text-align:center;padding:6px 2px;border:3px solid transparent}.pl.me{border-color:var(--gold);background:rgba(242,182,50,.25)}
.spr{width:50px;height:70px;image-rendering:pixelated;animation:bob 1s steps(2) infinite}.pl:nth-child(even) .spr{animation-delay:.5s}
@keyframes bob{50%{transform:translateY(-4px)}}
.nm{word-break:break-word;font-size:9px}
.q{color:var(--wood);margin-bottom:8px}.qt{font-size:14px;line-height:1.7;margin-bottom:14px}
.bar{height:18px;border:4px solid var(--wd);background:#fff}.bar i{display:block;height:100%;width:100%;background:var(--green)}
.tl{text-align:right;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;background:#fff;color:var(--ink);border:4px solid var(--wd);padding:12px;cursor:pointer;box-shadow:0 4px 0 var(--wd)}
.opt:active{transform:translateY(3px)}.opt[disabled]{cursor:default;transform:none}
.opt.sel{background:var(--gold)}.opt.ok{background:#8fd18f}.opt.bad{background:#e8998f}
.ok2{color:var(--green)}.dots{opacity:.6}.good{color:var(--green)}.badt{color:var(--red)}
.pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.pick button{background:none;border:3px solid transparent;cursor:pointer;padding:2px}.pick button.on{border-color:var(--gold);background:rgba(242,182,50,.35)}
.rk{list-style:none;padding:0;margin:10px 0}.rk li{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:3px dashed var(--wood)}
.rk li.me{background:rgba(242,182,50,.3)}.rk b{width:34px}.rk span{flex:1;word-break:break-word}.rk em{font-style:normal}
.sp2{width:30px;height:42px;image-rendering:pixelated}
.c{text-align:center}
</style></head>
<body>
<h1>🌾 FIRDIRA QUIZ 🌾</h1><div class="tag" id="role"></div>
<div id="app" class="panel c">Loading the farm…</div>
<script>
const T=15,REV=4,L='ABCD';
// ---- EDIT QUESTIONS HERE: q = question, o = 4 options, a = index of the correct option (0-3)
const Q=[
{q:"Tindakan penjawat awam yang memuat naik maklumat sulit agensinya melalui laman sosial melanggar prinsip",o:["integriti", "ketelusan", "pematuhan", "akauntabiliti"],a:2},
{q:"Tadbir urus yang cekap bertujuan untuk",o:["melaksanakan penguatkuasaan secara terpilih", "meningkatkan keupayaan kerajaan melaksanakan dasar", "menambahkan sumber manusia dalam perkhidmatan kerajaan", "mengekalkan karenah birokrasi dalam prosedur menjalankan tugas"],a:1},
{q:"Kekosongan kerusi Dewan Rakyat berlaku apabila Ahli Parlimen kawasan tersebut",o:["diisytiharkan muflis dan belum dilepaskan", "didakwa di mahkamah atas kesalahan membunuh", "dirujuk kepada Jawatankuasa Hak dan Kebebasan Dewan", "didapati gagal mengisytiharkan jumlah harta yang dimilikinya kepada Speaker Dewan"],a:0},
{q:"Yang manakah bidang kuasa Dewan Negara terhadap Rang Undang-Undang yang telah diluluskan oleh Dewan Rakyat?",o:["Meminda Rang Undang-Undang itu", "Menolak kelulusan Rang Undang-Undang itu", "Membatalkan kelulusan Rang Undang-Undang itu", "Menangguhkan kelulusan Rang Undang-Undang itu"],a:3},
{q:"Tugas Ketua Setiausaha Negara ialah",o:["meluluskan dasar-dasar pentadbiran Persekutuan", "mengawal selia perkhidmatan awam Persekutuan", "menguruskan perjalanan mesyuarat Majlis Raja-Raja", "menasihati Yang di-Pertuan Agong dalam pentadbiran Persekutuan"],a:1},
{q:"Fungsi Unit Perancang Ekonomi ialah",o:["memantau keberkesanan strategi program Satu Daerah Satu Industri", "menyediakan draf belanjawan kerajaan Persekutuan", "menyediakan rancangan pembangunan negara", "menyelaras Projek Kesejahteraan Rakyat"],a:2},
{q:"Tempoh genap lima tahun Dewan Rakyat dan Dewan Undangan Negeri bermula dari tarikh",o:["pengundian dijalankan", "penamaan calon pilihan raya", "keputusan pilihan raya diwartakan", "mesyuarat pertama Dewan selepas pilihan raya"],a:3},
{q:"Kebebasan asasi rakyat yang termaktub dalam Perlembagaan Persekutuan ialah",o:["peluang bertanding dalam pilihan raya", "peluang mendapat peguam bela jika ditangkap", "peluang menuntut hak sama rata antara gender", "peluang menjalankan perniagaan di persekutuan"],a:1},
{q:"Seorang pakar perubatan dari Britain yang telah bekerja di Malaysia selama 11 tahun boleh menjadi warganegara Malaysia setelah memenuhi beberapa syarat secara",o:["pendaftaran", "naturalisasi", "percantuman wilayah", "kuat kuasa undang-undang"],a:1},
{q:"Yang manakah kepentingan tadbir urus baik?",o:["Menambahkan bilangan tenaga kerja", "Memberikan keyakinan kepada pelabur asing", "Meningkatkan bilangan sektor awam yang diswastakan", "Meluaskan pengaruh kerajaan dalam pelbagai bidang ekonomi"],a:1},
{q:"Dasar tiada pemberian hadiah (no gift policy) yang diamalkan oleh syarikat kepentingan kerajaan ialah satu amalan tadbir urus baik yang berkaitan dengan prinsip",o:["mengutamakan pelanggan", "berkesan (efektif)", "integriti", "telus"],a:2},
{q:"Yang manakah dapat dikaitkan dengan aktiviti pengemaskinian laman web agensi dalam prinsip tadbir urus baik?",o:["akauntabiliti", "beretika", "efisien", "telus"],a:0},
{q:"Yang manakah pernyataan yang benar tentang tugas Jemaah Menteri?",o:["Merancang dasar kewangan dan belanjawan negara", "Menggubal dasar dan perancangan ekonomi negara", "Menggubal dasar gaji, elaun dan kemudahan kakitangan kerajaan", "Menentukan dasar kerajaan dan memberikan arahan kepada jentera pentadbiran kerajaan"],a:1},
{q:"Pernyataan yang manakah yang benar mengenai Jemaah Menteri Malaysia?",o:["Sidang Jemaah Menteri berlangsung di Parlimen", "Tempoh sebagai Jemaah Menteri kekal selama dua penggal", "Jemaah Menteri dilantik oleh Perdana Menteri selaku ketua kabinet", "Jemaah Menteri merupakan badan yang menjalankan kuasa eksekutif"],a:3},
{q:"Yang manakah menunjukkan Malaysia sebuah negara berdaulat?",o:["Hubungan pelbagai hala dengan negara lain", "Sempadan negara yang dikawal rapi", "Pemimpin negara yang berwibawa", "Sistem pemerintahan yang cekap"],a:1}
];
const CH=[["#5b3a1e","#f1c27d","#3b82c4","#3a3a6a"],["#d9822b","#f6d1a5","#c0392b","#4a3a2a"],["#222","#8d5524","#3c9a3c","#2c3e50"],["#f2d16b","#ffdbac","#8e44ad","#5d4037"],["#7b3f00","#c68642","#e67e22","#34495e"],["#aaa","#e0ac69","#16a085","#5a4632"],["#c0392b","#f1c27d","#f2b632","#3a3a6a"],["#111","#ffdbac","#ecf0f1","#7f8c8d"]];
const SP=["...hhhh...","..hhhhhh..","..hhhhhh..","..ssssss..","..sesses..","..ssssss..","...tttt...",".stttttts.",".stttttts.",".s.tttt.s.","...pppp...","...pppp...","...p..p...","..bb..bb.."];
const sc={};
function spr(i){i=(+i||0)%CH.length;if(sc[i])return sc[i];const c=document.createElement('canvas');c.width=10*6;c.height=14*6;const x=c.getContext('2d'),[h,s,t,p]=CH[i],m={h,s,t,p,b:'#3b2412',e:'#222'};
SP.forEach((r,y)=>[...r].forEach((k,xx)=>{if(m[k]){x.fillStyle=m[k];x.fillRect(xx*6,y*6,6,6)}}));return sc[i]=c.toDataURL()}
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,me='x',isHost=false,state={phase:'lobby',q:0,t0:0},players={},draft='',pick=0,busy=false,lastKey='';
const score=p=>{let s=0;Q.forEach((q,i)=>{const a=p.answers&&p.answers['q'+i];if(a&&a.c===q.a)s+=500+Math.round(500*Math.max(0,1-a.t/(T*1000)))});return s};
const rank=()=>Object.entries(players).map(([id,p])=>({id,p,s:score(p)})).sort((a,b)=>b.s-a.s);
const rankH=()=>`<ol class="rk">${rank().map((r,i)=>`<li class="${r.id===me?'me':''}"><b>${['🥇','🥈','🥉'][i]||(i+1)+'.'}</b><img class="sp2" src="${spr(r.p.ch)}" alt=""><span>${esc(r.p.name)}</span><em>${r.s}</em></li>`).join('')}</ol>`;
const plist=f=>`<div class="pls">${Object.entries(players).map(([id,p])=>`<div class="pl ${id===me?'me':''}"><img class="spr" src="${spr(p.ch)}" alt=""><div class="nm">${esc(p.name)}</div>${f?f(id,p):''}</div>`).join('')||'<p>No players yet…</p>'}</div>`;
const qB=()=>`<div class="q">QUESTION ${state.q+1} / ${Q.length}</div><div class="qt">${esc(Q[state.q].q)}</div>`;
const bar=()=>`<div class="bar"><i id="bf"></i></div><div class="tl" id="tl"></div>`;
const ans=p=>p&&p.answers&&p.answers['q'+state.q];
function opts(a,mode){const q=Q[state.q];return `<div class="opts">${q.o.map((o,i)=>{let c='';if(mode==='r'){if(i===q.a)c='ok';else if(a&&a.c===i)c='bad'}else if(a&&a.c===i)c='sel';return `<button class="opt ${c}" data-a="ans" data-v="${i}" ${a||mode==='r'||isHost?'disabled':''}>${L[i]}. ${esc(o)}</button>`}).join('')}</div>`}
function joinForm(){return `<p>Pick your farmer and a name!</p><div class="pick">${CH.map((_,i)=>`<button class="${i===pick?'on':''}" data-a="pick" data-v="${i}"><img class="sp2" style="width:40px;height:56px" src="${spr(i)}" alt="Character ${i+1}"></button>`).join('')}</div><input id="nm" maxlength="12" placeholder="Your name" value="${esc(draft)}"><br><button class="btn" data-a="join">JOIN THE FARM</button>`}
function hostView(){const ph=state.phase,q=Q[state.q];
if(ph==='lobby')return `<h2>Waiting lobby</h2><p>${Object.keys(players).length} farmer(s) here. Share the link!</p>${plist()}<button class="btn" data-a="start" ${Object.keys(players).length?'':'disabled'}>START QUIZ</button>`;
if(ph==='question'){const n=Object.values(players).filter(ans).length;return `${qB()}${bar()}<p>Answered: ${n} / ${Object.keys(players).length}</p>${plist((id,p)=>ans(p)?`<div class="ok2">✓ ${L[ans(p).c]}</div>`:'<div class="dots">thinking…</div>')}<button class="btn" data-a="skip">SKIP TIME</button>`}
if(ph==='reveal')return `${qB()}<p>Answer: <b class="good">${L[q.a]}. ${esc(q.o[q.a])}</b></p>${plist((id,p)=>{const a=ans(p);return a?(a.c===q.a?'<div class="good">✓ right</div>':`<div class="badt">✗ ${L[a.c]}</div>`):'<div class="dots">no answer</div>'})}<h3>Leaderboard</h3>${rankH()}<button class="btn" data-a="skip">NEXT</button>`;
return `<h2>🏆 Final ranking 🏆</h2>${rankH()}<button class="btn" data-a="again">PLAY AGAIN</button>`}
function playerView(){const ph=state.phase,mine=players[me];
if(!mine&&ph!=='final')return joinForm();
if(ph==='lobby')return `<h2>Waiting lobby</h2><p>The host will start soon…</p>${plist()}`;
if(ph==='question'){const a=ans(mine);return `${qB()}${bar()}${opts(a,'q')}${a?'<p>Locked in! Waiting…</p>':''}`}
if(ph==='reveal'){const a=ans(mine),ok=a&&a.c===Q[state.q].a;return `${qB()}${opts(a,'r')}<p class="${ok?'good':'badt'}">${!a?'Too slow!':ok?'Correct!':'Not quite!'}</p><p>Your score: ${score(mine)}</p><h3>Leaderboard</h3>${rankH()}`}
return `<h2>🏆 Final ranking 🏆</h2>${rankH()}<p>Thanks for playing!</p>`}
function render(){const had=document.activeElement&&document.activeElement.id==='nm';app.innerHTML=isHost?hostView():playerView();if(had){const n=$('nm');n.focus();n.setSelectionRange(99,99)}tick()}
function tick(){const bf=$('bf');if(bf){const left=Math.max(0,T-(Date.now()-state.t0)/1000);bf.style.width=left/T*100+'%';bf.style.background=left<5?'var(--red)':'var(--green)';$('tl').textContent=Math.ceil(left)+'s'}
if(!isHost||!db)return;const el=Date.now()-state.t0,P=Object.values(players),key=state.phase+state.q;if(key!==lastKey){lastKey=key;busy=false}
if(busy)return;
if(state.phase==='question'&&(el>=T*1000||(P.length&&el>800&&P.every(ans))))go('reveal',state.q);
else if(state.phase==='reveal'&&el>=REV*1000)next()}
const go=(ph,q)=>{busy=true;db.doc('game/state').set({phase:ph,q,t0:Date.now()}).catch(()=>busy=false)};
const next=()=>state.q+1<Q.length?go('question',state.q+1):go('final',state.q);
app.addEventListener('input',e=>{if(e.target.id==='nm')draft=e.target.value});
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!db)return;const a=b.dataset.a,v=+b.dataset.v;
if(a==='pick'){pick=v;render()}
else if(a==='join')db.doc('players/'+me).set({name:(draft.trim()||'Farmer').slice(0,12),ch:pick,answers:{}});
else if(a==='ans'&&state.phase==='question'&&Date.now()-state.t0<T*1000+500){const p=players[me];if(p&&!ans(p))db.doc('players/'+me).set({...p,answers:{...p.answers,['q'+state.q]:{c:v,t:Date.now()-state.t0}}})}
else if(a==='start')go('question',0);
else if(a==='skip')state.phase==='question'?go('reveal',state.q):next();
else if(a==='again'){go('lobby',0);Object.entries(players).forEach(([id,p])=>db.doc('players/'+id).set({...p,answers:{}}))}});
(async()=>{try{const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
if(!d){app.textContent='Please sign in to claude.ai to join the quiz.';return}
db=d;isHost=u?u.isOwner():false;me=u?await u.id():'x';$('role').textContent=isHost?'— HOST VIEW —':'— PLAYER —';
db.doc('game/state').onSnapshot(s=>{state=s.data()||state;render()});
db.collection('players').onSnapshot(s=>{players={};s.docs.forEach(d=>players[d.id]=d.data());render()});
setInterval(tick,250);render()}catch(e){app.textContent='Could not connect to the game.'}})();
</script></body></html>
