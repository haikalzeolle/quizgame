<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valley Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--grass:#6aa84f;--wood:#8b5a2b;--wd:#4a2e14;--parch:#f6e3b0;--ink:#3b2412;--gold:#f2b632;--red:#c0392b;--green:#3c9a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px);background:#2d4a1f}
body{margin:0;min-height:100vh;font:11px/1.6 'Press Start 2P',ui-monospace,monospace;color:var(--ink);background:transparent}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(30,60,20,.55),rgba(30,60,20,.55)),var(--ph) center/cover no-repeat}
h1{text-align:center;color:#fff;text-shadow:3px 3px 0 var(--wd);font-size:18px;margin:18px 8px 4px}
.tag{text-align:center;color:#fff;text-shadow:2px 2px 0 var(--wd);margin-bottom:6px}
.panel{background:var(--parch);border:4px solid var(--wd);box-shadow:0 0 0 4px var(--wood),0 8px 0 4px var(--wd);padding:16px;margin:18px auto;max-width:720px;width:calc(100% - 28px)}
.btn{font:inherit;background:var(--gold);color:var(--ink);border:4px solid var(--wd);padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 var(--wd);margin:6px 4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wd)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.alt{background:#fff}.btn.on{background:#8fd18f}
input{font:inherit;padding:10px;border:4px solid var(--wd);background:#fff;width:100%;max-width:260px}
.pls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pl{width:110px;text-align:center;padding:6px 2px;border:3px solid transparent}.pl.me{border-color:var(--gold);background:rgba(242,182,50,.25)}
.spr{width:54px;height:72px;image-rendering:pixelated;animation:bob 1s steps(2) infinite}.pl:nth-child(even) .spr{animation-delay:.5s}
@keyframes bob{50%{transform:translateY(-4px)}}
.nm{word-break:break-word;font-size:9px}
.mt{font-size:8px;line-height:1.5;word-break:break-word;margin-top:3px}
.q{color:var(--wood);margin-bottom:8px}.qt{font-size:14px;line-height:1.7;margin-bottom:14px}
.bar{height:18px;border:4px solid var(--wd);background:#fff}.bar i{display:block;height:100%;width:100%;background:var(--green)}
.tl{text-align:right;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;background:#fff;color:var(--ink);border:4px solid var(--wd);padding:12px;cursor:pointer;box-shadow:0 4px 0 var(--wd)}
.opt:active{transform:translateY(3px)}.opt[disabled]{cursor:default;transform:none}
.opt.sel{background:var(--gold)}.opt.ok{background:#8fd18f}.opt.bad{background:#e8998f}
.ok2{color:var(--green)}.dots{opacity:.6}.good{color:var(--green)}.badt{color:var(--red)}
.rk{list-style:none;padding:0;margin:10px 0}.rk li{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:3px dashed var(--wood)}
.rk li.me{background:rgba(242,182,50,.3)}.rk b{width:34px}.rk span{flex:1;word-break:break-word}.rk em{font-style:normal}
.sp2{width:30px;height:40px;image-rendering:pixelated}
.c{text-align:center}
/* character editor */
.prev{position:sticky;top:6px;z-index:2;background:var(--parch);border:4px solid var(--wd);padding:8px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.big{width:90px;height:120px;image-rendering:pixelated}
.ed{text-align:left}.er{margin:10px 0}.el{display:block;font-size:9px;color:var(--wood);margin-bottom:5px}
.eo{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:9px;background:#fff;color:var(--ink);border:3px solid var(--wd);padding:6px 8px;cursor:pointer}.chip.on{background:var(--gold)}
.sw{width:26px;height:26px;border:3px solid var(--wd);cursor:pointer;padding:0}.sw.on{outline:4px solid var(--gold);outline-offset:1px}
.bdg{font-size:18px;padding:3px 6px}
.ed input{max-width:100%}
.foot{display:flex;justify-content:center;margin:6px 0 30px}
.photo{width:84px;height:112px;border:4px solid var(--wd);box-shadow:0 0 0 4px var(--wood),0 6px 0 4px var(--wd);background:var(--ph) 55% 62%/cover no-repeat;filter:grayscale(1)}
</style></head>
<body>

function shade(h,a){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v+a));return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}

const S=6,c=document.createElement('canvas');c.width=12*S;c.height=16*S;const x=c.getContext('2d');

[2,9].forEach(ax0=>{if(long){R(ax0,9,1,3,top);R(ax0,12,1,1,skin)}else{R(ax0,9,1,2,top);R(ax0,11,1,2,skin)}});
// legs + shoes

else if(bs===1){R(3,13,2,1,bot);R(7,13,2,1,bot);R(5,13,2,1,bot);R(3,14,2,1,skin);R(7,14,2,1,skin)}

// torso

R(5,8,2,1,skin);

if(ts===3)R(3,10,6,1,shade(top,60));
if(ts===4){R(5,9,2,1,'#f2d16b');R(5,10,1,1,'#f2d16b');R(6,10,1,1,'#f2d16b')}
// head

R(4,4,1,1,'#222');R(7,4,1,1,'#222');

else if(fc===2){R(5,6,2,2,mouth)}
else{R(5,6,2,1,mouth);if(fc===3){R(3,5,1,1,'#f4a6a6');R(8,5,1,1,'#f4a6a6')}}
// hair
if(hs===0||hs===1||hs===6){R(3,1,6,2,hair);R(3,3,1,1,hair);R(8,3,1,1,hair)}
if(hs===2){R(3,1,6,2,hair);R(3,0,1,1,hair);R(5,0,1,1,hair);R(7,0,1,1,hair);R(3,3,1,1,hair);R(8,3,1,1,hair)}
if(hs===3){R(3,1,6,2,hair);R(3,3,1,1,hair);R(8,3,1,1,hair);R(5,0,2,1,hair)}
if(hs===4){R(2,0,8,3,hair);R(2,3,1,3,hair);R(9,3,1,3,hair);R(3,3,1,1,hair);R(8,3,1,1,hair)}
if(hs===5){R(5,0,2,3,hair)}
if(hs===6){R(9,3,1,1,hair);R(10,4,1,4,hair)}
// hats
if(ht===1){R(4,0,4,1,'#fff');R(3,1,6,2,'#f4f4f4');R(3,2,6,1,'#ddd')}
if(ht===2){R(3,0,6,3,'#1c1c1c');R(3,2,6,1,'#3a3a3a')}
if(ht===3){R(3,1,6,2,acc);R(3,3,7,1,shade(acc,-45))}
if(ht===4){R(3,1,6,2,acc);R(5,0,2,1,shade(acc,60));R(3,2,6,1,shade(acc,-25))}
if(ht===5){R(3,0,6,2,'#e0b857');R(3,1,6,1,acc);R(1,2,10,1,'#cfa13e')}
if(ht===6){R(3,1,6,1,'#f2b632');R(3,0,1,1,'#f2b632');R(5,0,1,1,'#f2b632');R(7,0,1,1,'#f2b632')}
if(ht===7){R(3,2,6,1,acc);R(9,2,1,1,acc);R(10,3,1,1,acc)}
// accessories
if(ax===1){[[3,4],[4,3],[4,5],[5,4],[6,4],[7,3],[7,5],[8,4]].forEach(([a,b])=>R(a,b,1,1,'#222'))}
if(ax===2){R(3,4,6,2,'#111');R(4,4,1,1,'#555');R(7,4,1,1,'#555')}
if(ax===3){R(3,6,6,2,'#cfe8f3')}
if(ax===4){R(3,8,6,1,acc);R(7,9,2,2,shade(acc,-30))}
if(ax===5){R(5,9,2,1,acc);R(5,10,2,2,acc)}
if(ax===6){R(4,5,4,1,'#2a1a10')}
return sc[key]=c.toDataURL()}
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,me='x',isHost=false,state={phase:'lobby',q:0,t0:0},players={},draft='',busy=false,lastKey='',drafts={name:null,motto:null},saveT=0;
const score=p=>{let s=0;Q.forEach((q,i)=>{const a=p.answers&&p.answers['q'+i];if(a&&a.c===q.a)s+=500+Math.round(500*Math.max(0,1-a.t/(T*1000)))});return s};
const rank=()=>Object.entries(players).map(([id,p])=>({id,p,s:score(p)})).sort((a,b)=>b.s-a.s);
const rankH=()=>`<ol class="rk">${rank().map((r,i)=>`<li class="${r.id===me?'me':''}"><b>${['🥇','🥈','🥉'][i]||(i+1)+'.'}</b><img class="sp2" src="${spr(r.p.av)}" alt=""><span>${esc(r.p.name)} ${esc(r.p.badge||'')}</span><em>${r.s}</em></li>`).join('')}</ol>`;
const plist=(f,meta)=>`<div class="pls">${Object.entries(players).map(([id,p])=>`<div class="pl ${id===me?'me':''}"><img class="spr" src="${spr(p.av)}" alt=""><div class="nm">${esc(p.name)}</div>${meta?`<div class="mt">${esc(p.badge||'')} ${esc(p.motto||'')}</div>${p.ready?'<div class="mt good">✓ READY</div>':'<div class="mt dots">not ready</div>'}`:''}${f?f(id,p):''}</div>`).join('')||'<p>No players yet…</p>'}</div>`;
const qB=()=>`<div class="q">QUESTION ${state.q+1} / ${Q.length}</div><div class="qt">${esc(Q[state.q].q)}</div>`;
const bar=()=>`<div class="bar"><i id="bf"></i></div><div class="tl" id="tl"></div>`;
const ans=p=>p&&p.answers&&p.answers['q'+state.q];
function opts(a,mode){const q=Q[state.q];return `<div class="opts">${q.o.map((o,i)=>{let c='';if(mode==='r'){if(i===q.a)c='ok';else if(a&&a.c===i)c='bad'}else if(a&&a.c===i)c='sel';return `<button class="opt ${c}" data-a="ans" data-v="${i}" ${a||mode==='r'||isHost?'disabled':''}>${L[i]}. ${esc(o)}</button>`}).join('')}</div>`}
function joinForm(){return `<p>What's your name, farmer?</p><input id="nm" maxlength="12" placeholder="Your name" value="${esc(draft)}"><br><button class="btn" data-a="join">ENTER THE LOBBY</button><p class="dots">You can build your character inside.</p>`}
function editor(mine){const av=mine.av||DEF,nv=drafts.name!=null?drafts.name:mine.name,mv=drafts.motto!=null?drafts.motto:(mine.motto||'');
const rows=ED.map(([label,k,arr])=>{const isC=arr[0][0]==='#',cur=(+av[k]||0)%arr.length;
return `<div class="er"><span class="el">${label}</span><div class="eo">${arr.map((v,i)=>isC?`<button class="sw ${i===cur?'on':''}" data-a="av" data-k="${k}" data-v="${i}" style="background:${v}" aria-label="${label} ${i+1}"></button>`:`<button class="chip ${i===cur?'on':''}" data-a="av" data-k="${k}" data-v="${i}">${v}</button>`).join('')}</div></div>`}).join('');
return `<div class="prev"><img class="big" src="${spr(av)}" alt="Your farmer"><div><div style="font-size:11px">${esc(mine.name)}</div><div class="mt">${esc(mine.badge||'')} ${esc(mine.motto||'')}</div></div></div>
<div class="ed"><div class="er"><span class="el">Name</span><input id="en" data-f="name" maxlength="12" value="${esc(nv)}"></div>
<div class="er"><span class="el">Motto (shown under your name)</span><input id="em" data-f="motto" maxlength="22" placeholder="e.g. Ready to win!" value="${esc(mv)}"></div>
<div class="er"><span class="el">Badge</span><div class="eo">${BADGES.map((b,i)=>`<button class="chip bdg ${mine.badge===b?'on':''}" data-a="badge" data-v="${i}">${b}</button>`).join('')}</div></div>
${rows}</div>
<div><button class="btn alt" data-a="rand">🎲 RANDOM</button><button class="btn ${mine.ready?'on':''}" data-a="ready">${mine.ready?'✓ READY!':"I'M READY"}</button></div>`}
function hostView(){const ph=state.phase,q=Q[state.q];
if(ph==='lobby'){const n=Object.keys(players).length,r=Object.values(players).filter(p=>p.ready).length;return `<h2>Waiting lobby</h2><p>${n} farmer(s) here · ${r} ready. Share the link!</p>${plist(null,true)}<button class="btn" data-a="start" ${n?'':'disabled'}>START QUIZ</button>`}
if(ph==='question'){const n=Object.values(players).filter(ans).length;return `${qB()}${bar()}<p>Answered: ${n} / ${Object.keys(players).length}</p>${plist((id,p)=>ans(p)?`<div class="ok2">✓ ${L[ans(p).c]}</div>`:'<div class="dots">thinking…</div>')}<button class="btn" data-a="skip">SKIP TIME</button>`}
if(ph==='reveal')return `${qB()}<p>Answer: <b class="good">${L[q.a]}. ${esc(q.o[q.a])}</b></p>${plist((id,p)=>{const a=ans(p);return a?(a.c===q.a?'<div class="good">✓ right</div>':`<div class="badt">✗ ${L[a.c]}</div>`):'<div class="dots">no answer</div>'})}<h3>Leaderboard</h3>${rankH()}<button class="btn" data-a="skip">NEXT</button>`;
return `<h2>🏆 Final ranking 🏆</h2>${rankH()}<button class="btn" data-a="again">PLAY AGAIN</button>`}
function playerView(){const ph=state.phase,mine=players[me];
if(!mine&&ph!=='final')return joinForm();
if(ph==='lobby')return `<h2>Waiting lobby</h2><p>Customize your farmer while you wait!</p>${editor(mine)}<h3>Farmers in the lobby</h3>${plist(null,true)}`;
if(ph==='question'){const a=ans(mine);return `${qB()}${bar()}${opts(a,'q')}${a?'<p>Locked in! Waiting…</p>':''}`}
if(ph==='reveal'){const a=ans(mine),ok=a&&a.c===Q[state.q].a;return `${qB()}${opts(a,'r')}<p class="${ok?'good':'badt'}">${!a?'Too slow!':ok?'Correct!':'Not quite!'}</p><p>Your score: ${score(mine)}</p><h3>Leaderboard</h3>${rankH()}`}
return `<h2>🏆 Final ranking 🏆</h2>${rankH()}<p>Thanks for playing!</p>`}
function render(){const ae=document.activeElement,fid=ae&&ae.id,fs=ae&&ae.selectionStart,y=window.scrollY;app.innerHTML=isHost?hostView():playerView();window.scrollTo(0,y);if(fid&&['nm','en','em'].includes(fid)){const n=$(fid);if(n){n.focus();try{n.setSelectionRange(fs,fs)}catch(e){}}}tick()}
function tick(){const bf=$('bf');if(bf){const left=Math.max(0,T-(Date.now()-state.t0)/1000);bf.style.width=left/T*100+'%';bf.style.background=left<5?'var(--red)':'var(--green)';$('tl').textContent=Math.ceil(left)+'s'}
if(!isHost||!db)return;const el=Date.now()-state.t0,P=Object.values(players),key=state.phase+state.q;if(key!==lastKey){lastKey=key;busy=false}
if(busy)return;
if(state.phase==='question'&&(el>=T*1000||(P.length&&el>800&&P.every(ans))))go('reveal',state.q);
else if(state.phase==='reveal'&&el>=REV*1000)next()}
const go=(ph,q)=>{busy=true;db.doc('game/state').set({phase:ph,q,t0:Date.now()}).catch(()=>busy=false)};
const next=()=>state.q+1<Q.length?go('question',state.q+1):go('final',state.q);
const savePl=patch=>{const p=players[me];if(p&&db)db.doc('players/'+me).set({...p,...patch})};
app.addEventListener('input',e=>{const t=e.target;if(t.id==='nm')draft=t.value;
if(t.dataset.f){drafts[t.dataset.f]=t.value;clearTimeout(saveT);saveT=setTimeout(()=>{const p=players[me];if(!p)return;const d=drafts,patch={};if(d.name!=null)patch.name=(d.name.trim()||p.name).slice(0,12);if(d.motto!=null)patch.motto=d.motto.trim().slice(0,22);drafts={name:null,motto:null};savePl(patch)},400)}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!db)return;const a=b.dataset.a,v=+b.dataset.v,p=players[me],lobby=state.phase==='lobby';
if(a==='join')db.doc('players/'+me).set({name:(draft.trim()||'Farmer').slice(0,12),av:randomAv(),badge:'🌾',motto:'',ready:false,answers:{}});
else if(a==='av'&&p&&lobby)savePl({av:{...(p.av||DEF),[b.dataset.k]:v}});
else if(a==='rand'&&p&&lobby)savePl({av:randomAv()});
else if(a==='badge'&&p&&lobby)savePl({badge:BADGES[v]});
else if(a==='ready'&&p&&lobby)savePl({ready:!p.ready});
else if(a==='ans'&&state.phase==='question'&&Date.now()-state.t0<T*1000+500){if(p&&!ans(p))db.doc('players/'+me).set({...p,answers:{...p.answers,['q'+state.q]:{c:v,t:Date.now()-state.t0}}})}
else if(a==='start')go('question',0);
else if(a==='skip')state.phase==='question'?go('reveal',state.q):next();
else if(a==='again'){go('lobby',0);Object.entries(players).forEach(([id,p])=>db.doc('players/'+id).set({...p,answers:{},ready:false}))}});
(async()=>{try{const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
if(!d){app.textContent='Please sign in to claude.ai to join the quiz.';return}
db=d;isHost=u?u.isOwner():false;me=u?await u.id():'x';$('role').textContent=isHost?'— HOST VIEW —':'— PLAYER —';
db.doc('game/state').onSnapshot(s=>{state=s.data()||state;render()});
db.collection('players').onSnapshot(s=>{players={};s.docs.forEach(d=>players[d.id]=d.data());render()});
setInterval(tick,250);render()}catch(e){app.textContent='Could not connect to the game.'}})();
